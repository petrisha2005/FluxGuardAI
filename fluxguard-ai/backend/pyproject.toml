[project]
name = "fluxguard-ai-api"
version = "0.1.0"
description = "FastAPI foundation for FluxGuard AI"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29.0",
  "fastapi>=0.112.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
  "black>=24.4.2",
  "httpx>=0.27.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"

