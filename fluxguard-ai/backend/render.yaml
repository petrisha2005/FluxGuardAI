services:
  - type: web
    name: fluxguard-ai-backend
    runtime: python
    rootDir: fluxguard-ai/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FRONTEND_URLS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
